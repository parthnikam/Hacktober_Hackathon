<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graph — Context for Humans</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="graph-page">
    <header class="top">
      <div class="brand">
        <img class="logo" src="icons/brain.svg" alt="" width="40" height="40" />
        <div>
          <p class="eyebrow">Context for Humans</p>
          <h1>Graph</h1>
        </div>
      </div>
      <p id="source" class="meta">Sample data</p>
    </header>
    <div class="graph-stage">
      <canvas class="graph-canvas"></canvas>
      <div class="graph-hud">
        <input id="find" class="graph-find" type="search" placeholder="Find a project or link" aria-label="Find in the graph" />
      </div>
      <div id="detail" class="graph-detail" hidden></div>
    </div>
    <p id="status" class="status">Drag to move. Scroll to zoom. Double-click a project to open it. Click a link to open that page.</p>
    <script type="module" src="graph.js"></script>
  </body>
</html>
