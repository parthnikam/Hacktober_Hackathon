<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Context for Humans</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div class="bar">
      <header class="top">
        <div class="brand">
          <img class="logo" src="icons/brain.svg" alt="" width="40" height="40" />
          <p class="eyebrow">Context for Humans</p>
        </div>
      </header>
      <nav class="views" aria-label="Features">
        <button type="button" data-view="projects" aria-selected="true">Projects</button>
        <button type="button" data-view="timeline" aria-selected="false">Timeline</button>
        <button type="button" data-view="active" aria-selected="false">Active tabs</button>
        <button type="button" data-view="graph" aria-selected="false">Graph</button>
      </nav>
      <form id="ask" class="ask">
        <div class="ask-field">
          <input id="question" type="text" placeholder="Name the project you're working on, or ask" autocomplete="off" enterkeyhint="search" />
          <button id="voice" class="voice" type="button" aria-label="Talk" data-state="idle">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <rect x="6" y="1.5" width="4" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.4" />
              <path d="M4 7.5a4 4 0 0 0 8 0M8 11.5V14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </button>
          <button class="send" type="submit" aria-label="Ask">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path d="M8 13V3.5M8 3.5L3.5 8M8 3.5L12.5 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </form>
      <p id="status" class="status" role="status"></p>
      <details id="errors" class="errors" hidden>
        <summary>Error</summary>
        <div data-error-list></div>
      </details>
      <p id="watching" class="watching" hidden></p>
    </div>
    <main id="view"></main>
    <footer>
      <button id="options" class="text" type="button">API keys</button>
      <p id="source">Sample data</p>
    </footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
