<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Allow the microphone</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #1d1a16;
        font: 16px/1.45 "Segoe UI", sans-serif;
      }
      main {
        max-width: 380px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 650;
      }
      p {
        margin: 0 0 16px;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: #243f34;
        color: #f4f1ea;
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #141311;
          color: #f3efe7;
        }
        button {
          background: #d5e3d6;
          color: #17211b;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow the microphone</h1>
      <p id="mic-status">The side panel cannot show Chrome’s permission prompt. Click the button and choose Allow.</p>
      <button id="allow" type="button">Allow microphone</button>
    </main>
    <script type="module" src="mic.js"></script>
  </body>
</html>
